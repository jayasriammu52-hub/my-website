<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Prompt Generator 🚀</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  min-height: 100vh;
}

header {
  background: #111827;
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #334155;
}

header h1 {
  color: #38bdf8;
  font-size: 28px;
}

header p {
  color: #cbd5e1;
  margin-top: 8px;
}

.container {
  max-width: 700px;
  margin: 30px auto;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 25px;
  border-radius: 18px;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

label {
  display: block;
  margin-bottom: 8px;
  color: #38bdf8;
  font-weight: bold;
}

input, textarea, select {
  width: 100%;
  padding: 14px;
  margin-bottom: 18px;
  border: 1px solid #475569;
  border-radius: 10px;
  background: #0f172a;
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #38bdf8;
  color: #082f49;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #7dd3fc;
}

.copy-btn {
  margin-top: 12px;
  background: #22c55e;
  color: white;
}

.copy-btn:hover {
  background: #4ade80;
}

#result {
  display: none;
}

.prompt-box {
  background: #0f172a;
  border: 1px solid #475569;
  border-radius: 12px;
  padding: 18px;
  line-height: 1.7;
  white-space: pre-wrap;
  color: #e2e8f0;
}

footer {
  text-align: center;
  padding: 30px;
  color: #64748b;
}
</style>
</head>

<body>

<header>
  <h1>🤖 AI Prompt Generator 🚀</h1>
  <p>Create powerful AI prompts easily</p>
</header>

<div class="container">

  <div class="card">

    <label>🎯 What do you want AI to do?</label>
    <textarea id="task"
      placeholder="Example: Create a YouTube video script about mobile photography"></textarea>

    <label>🧠 AI Role</label>
    <input id="role"
      placeholder="Example: Expert YouTube Script Writer">

    <label>👥 Target Audience</label>
    <input id="audience"
      placeholder="Example: Beginners">

    <label>🎨 Style</label>
    <select id="style">
      <option>Professional</option>
      <option>Creative</option>
      <option>Friendly</option>
      <option>Simple</option>
      <option>Detailed</option>
    </select>

    <label>📏 Output Length</label>
    <select id="length">
      <option>Short</option>
      <option>Medium</option>
      <option>Detailed</option>
    </select>

    <button onclick="generatePrompt()">
      ✨ Generate AI Prompt
    </button>

  </div>

  <div class="card" id="result">

    <h2>🚀 Your AI Prompt</h2>

    <br>

    <div class="prompt-box" id="prompt"></div>

    <button class="copy-btn" onclick="copyPrompt()">
      📋 Copy Prompt
    </button>

  </div>

</div>

<footer>
  © 2026 AI Prompt Generator | Made with ❤️
</footer>

<script>

function generatePrompt() {

  const task = document.getElementById("task").value.trim();
  const role = document.getElementById("role").value.trim();
  const audience = document.getElementById("audience").value.trim();
  const style = document.getElementById("style").value;
  const length = document.getElementById("length").value;

  if (task === "") {
    alert("Please enter what you want AI to do.");
    return;
  }

  const finalRole =
    role || "an expert assistant";

  const finalAudience =
    audience || "general audience";

  const prompt = `You are ${finalRole}.

Your task:
${task}

Target audience:
${finalAudience}

Writing style:
${style}

Output length:
${length}

Instructions:
- Understand the task carefully.
- Give a clear and useful answer.
- Organize the response logically.
- Use simple language where possible.
- Include practical examples when useful.
- Do not add unnecessary information.
- Make the final answer easy to understand and use.

Now complete the task professionally.`;

  document.getElementById("prompt").textContent = prompt;
  document.getElementById("result").style.display = "block";

  window.scrollTo({
    top: document.getElementById("result").offsetTop,
    behavior: "smooth"
  });
}

function copyPrompt() {

  const prompt =
    document.getElementById("prompt").textContent;

  navigator.clipboard.writeText(prompt);

  alert("✅ Prompt copied!");
}

</script>

</body>
</html>
